name: Build en release
# Bij elke push naar main: bouwen, testen en de jar als GitHub Release klaarzetten (build-<nummer>). De app op de Windows-server haalt
# daar zijn updates op (docs/auto-update.md). De repository is publiek, dus de server heeft geen token nodig.
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: build-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Bouwen en testen
        run: mvn -B --no-transfer-progress clean package -Dbuild.number=${{ github.run_number }} -Dbuild.commit=${{ github.sha }}
      - name: Release klaarzetten
        env:
          GH_TOKEN: ${{ github.token }}
          NUMMER: ${{ github.run_number }}
        run: |
          cp target/hkh-workflow.jar hkh-workflow.jar
          sha256sum hkh-workflow.jar > hkh-workflow.jar.sha256
          gh release create "build-$NUMMER" hkh-workflow.jar hkh-workflow.jar.sha256 \
            --target "$GITHUB_SHA" --title "Build $NUMMER" \
            --notes "Gebouwd uit commit $GITHUB_SHA: $(git log -1 --format=%s)"
      - name: Oude releases opruimen (de laatste 20 blijven)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^build-[0-9]*$' | sort -t- -k2 -n -r | tail -n +21 \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
