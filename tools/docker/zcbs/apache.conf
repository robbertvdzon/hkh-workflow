ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgid_module modules/mod_cgid.so
User hkhadmin
Group hkhadmin
ServerName zcbs.test
UseCanonicalName On
DocumentRoot "/home/hkhadmin/domains/historischekringheemskerk.nl/public_html"
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined
TypesConfig conf/mime.types
DirectoryIndex index.html
<Directory "/home/hkhadmin/domains/historischekringheemskerk.nl/public_html">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Directory "/home/hkhadmin/domains/historischekringheemskerk.nl/public_html/cgi-bin">
    Options +ExecCGI -Indexes
    AddHandler cgi-script .pl
    Require all granted
</Directory>
