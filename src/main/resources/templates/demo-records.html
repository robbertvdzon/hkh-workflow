<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Records bewerken')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: side}"></nav>
    <main>
        <a class="back" th:href="@{/demo-flow}">← Terug naar de batch</a>
        <div class="head">
            <div>
                <h1>7. Bewerken <span class="demo">Demo</span></h1>
                <p class="sub"><span th:text="${state.handled()}">0</span> van <span th:text="${state.records.size()}">12</span> opgeslagen<span th:if="${state.later() > 0}" th:text="', ' + ${state.later()} + ' later'"></span> · ingelogd als <b th:text="${state.user}">Carla</b></p>
            </div>
        </div>
        <div class="alert alert-ok" th:if="${saved != null}" th:text="'Record ' + ${saved} + ' is opgeslagen en teruggecontroleerd. De beheerder krijgt een e-mail met het record.'"></div>
        <div class="bar"><span th:style="'width:' + ${state.handled() * 100 / state.records.size()} + '%'"></span></div>
        <section class="table">
            <div class="tr th" style="grid-template-columns:70px 130px minmax(0,1fr) 140px 150px"><span>Nummer</span><span>Bestand</span><span>Titel</span><span>Status</span><span></span></div>
            <div class="tr" th:each="r : ${state.records}" style="grid-template-columns:70px 130px minmax(0,1fr) 140px 150px">
                <span class="mono" th:text="${r.nr}">11934</span>
                <span class="mono muted" th:text="${r.file}" style="font-size:12.5px">scan.pdf</span>
                <span th:text="${r.title.isEmpty()} ? '(nog leeg)' : ${r.title}" th:classappend="${r.title.isEmpty()} ? 'muted'" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" th:title="${r.title}">Titel</span>
                <span><span class="chip" th:classappend="'c-' + ${r.status.kind}" th:text="${r.status.label}">status</span></span>
                <span class="row-actions" style="justify-content:flex-end">
                    <a class="btn btn-s btn-sm" th:if="${r.status.name() == 'OPGESLAGEN'}" th:href="${zcbsBase} + '/archief.pl?ident=' + ${r.nr}" target="_blank">Open in ZCBS</a>
                    <a class="btn btn-p btn-sm" th:if="${r.status.name() == 'OPEN' or r.status.name() == 'BEZIG'}" th:href="@{/demo-flow/records/{nr}(nr=${r.nr})}" th:text="${r.status.name() == 'BEZIG'} ? 'Verder' : 'Open'">Open</a>
                    <a class="btn btn-s btn-sm" th:if="${r.status.name() == 'LATER'}" th:href="@{/demo-flow/records/{nr}(nr=${r.nr})}">Bewerk nu</a>
                    <a class="btn btn-s btn-sm" th:if="${r.status.name() == 'ONVEILIG'}" th:href="@{/demo-flow/records/{nr}(nr=${r.nr})}">Bekijk</a>
                </span>
            </div>
        </section>
        <div class="selbar">
            <span class="hint">Een geopend record is 10 minuten voor anderen vergrendeld. Verder kan zodra elk record is opgeslagen of op "later" staat.</span>
            <form th:action="@{/demo-flow/volgende}" method="post"><button class="btn btn-p" type="submit" th:disabled="${!state.allHandled()}">Verder met afsluiten</button></form>
        </div>
    </main>
</div>
</body>
</html>
