<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Voorbeeld van de wijziging')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: side}"></nav>
    <main>
        <div class="head">
            <div>
                <h1>Voorbeeld van de wijziging <span class="demo">Demo</span></h1>
                <p class="sub">Record <span class="mono" th:text="${r.nr}">11934</span> · <span class="mono" th:text="${r.file}">scan.pdf</span></p>
            </div>
        </div>
        <form method="post" class="stack" style="gap:18px">
            <input type="hidden" th:each="e : ${v}" th:name="${e.key}" th:value="${e.value}">
            <input type="hidden" name="a24" th:each="t : ${themes}" th:value="${t}">
            <input type="hidden" name="scenario" th:value="${scenario}">
            <section class="table" th:if="${!changes.isEmpty()}">
                <div class="tr th" style="grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)"><span>Veld</span><span>Was</span><span>Wordt</span></div>
                <div class="tr" th:each="c : ${changes}" style="grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)">
                    <span th:text="${c.label}">Titel</span>
                    <span class="diff-old" th:text="${c.old.isEmpty()} ? '(leeg)' : ${c.old}">oud</span>
                    <span class="diff-new" th:text="${c.new.isEmpty()} ? '(leeg)' : ${c.new}">nieuw</span>
                </div>
            </section>
            <div class="alert alert-info" th:if="${changes.isEmpty()}">Er is niets gewijzigd. Opslaan doet dan niets.</div>
            <div class="alert alert-info" th:if="${!changes.isEmpty()}">Opslaan stuurt een e-mail naar de beheerder met het hele record. Daarna leest de app het record terug uit ZCBS en controleert het.</div>
            <div class="row-actions">
                <button class="btn btn-p" type="submit" th:formaction="@{/demo-flow/records/{nr}/opslaan(nr=${r.nr})}" th:disabled="${changes.isEmpty()}">Opslaan</button>
                <button class="btn btn-s" type="submit" th:formaction="@{/demo-flow/records/{nr}/terug(nr=${r.nr})}">Terug naar het formulier</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
