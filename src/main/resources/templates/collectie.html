<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Collectie')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: side}"></nav>
    <main>
        <div>
            <h1>Met welke collectie wil je werken?</h1>
            <p class="sub">Ingelogd bij ZCBS als <b th:text="${zcbsUser}">Carla</b>.</p>
        </div>
        <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>
        <div class="choices">
            <th:block th:each="c : ${collections}">
                <a class="choice" th:if="${c.enabled}" th:href="@{/collectie/{c}(c=${c.name})}">
                    <b th:text="${c.name}">archief</b>
                    <span class="hint" th:text="${c.hint}">Collectie in ZCBS</span>
                </a>
                <span class="choice choice-off" th:unless="${c.enabled}" aria-disabled="true">
                    <b th:text="${c.name}">beeldbank</b>
                    <span class="hint" th:text="${c.hint}">Nog niet beschikbaar</span>
                </span>
            </th:block>
        </div>
    </main>
</div>
</body>
</html>
