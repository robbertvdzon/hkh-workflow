<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — ZcbsServer'">ZcbsServer</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/img/favicon-hkh.png}">
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
</head>
<body>
<nav th:fragment="side" class="side" aria-label="Hoofdmenu">
    <div class="brand"><b>ZcbsServer</b><span>Historische Kring Heemskerk</span></div>
    <a class="nav" th:classappend="${active == 'start'} ? 'on'" th:href="@{/}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Start</a>
    <form th:if="${zcbsUser != null}" method="post" th:action="@{/zcbs/logout}" style="padding:8px 0 0">
        <input type="hidden" name="terug" value="/"><button class="btn btn-s" type="submit" style="width:100%">Uitloggen</button></form>
    <div class="hint" th:if="${zcbsUser != null}" style="padding:14px 12px 0">
        <b>Rechten in ZCBS</b><br>
        <span th:if="${zcbsRights.isEmpty()}">geen</span>
        <span th:each="r, st : ${zcbsRights}" th:text="${r} + (${st.last} ? '' : ', ')">archief</span>
    </div>
    <div class="sep" th:if="${isAdmin}">Beheer</div>
    <a class="nav" th:if="${isAdmin}" th:classappend="${active == 'instellingen'} ? 'on'" th:href="@{/instellingen}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Instellingen</a>
    <a class="nav" th:unless="${isAdmin}" th:classappend="${active == 'beheer'} ? 'on'" th:href="@{/beheer}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Beheer</a>
    <form th:if="${isAdmin}" method="post" th:action="@{/beheer/uitloggen}" style="padding:0 12px"><button class="linkbtn" type="submit">Uitloggen als beheerder</button></form>
    <div style="flex-grow:1"></div>
    <div class="hint" style="padding:16px 12px 0;border-top:1px solid #e0d8c6;color:var(--err);font-weight:600" th:if="${zcbsUser != null and zcbsRealArchive}">Het echte archief</div>
</nav>
</body>
</html>
