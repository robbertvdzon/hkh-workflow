<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="answers(prefix, title, rows)" class="card pad" style="display:flex;flex-direction:column;gap:12px">
    <h2 th:text="${title}">Antwoorden</h2>
    <p class="hint" style="margin:0">Bij <b>Automatisch uitvoeren</b>: zodra de uitvoer de tekst links bevat, stuurt de app het antwoord rechts plus Enter.
        Leeg antwoord = alleen Enter. Laat de tekst leeg om een regel te verwijderen. Bovenste regel gaat voor bij gelijke positie.</p>
    <input type="hidden" th:name="${prefix} + 'Count'" th:value="${rows.size()}">
    <div class="tr th" style="grid-template-columns:minmax(0,1fr) 220px 130px;padding:0 4px">
        <span>Als de uitvoer bevat</span><span>Antwoord</span><span>Wachtwoord</span>
    </div>
    <div th:each="r : ${rows}" style="display:grid;grid-template-columns:minmax(0,1fr) 220px 130px;gap:10px;align-items:center">
        <input type="text" th:name="${prefix} + 'Pattern-' + ${r.index}" th:value="${r.pattern}" placeholder="nieuwe regel…" th:aria-label="'Tekst in uitvoer, regel ' + ${r.index + 1}">
        <input th:type="${r.secret} ? 'password' : 'text'" th:name="${prefix} + 'Answer-' + ${r.index}" th:value="${r.answer}" autocomplete="new-password"
               th:placeholder="${r.secret} ? (${r.hasSecretValue} ? '•••••••• (opgeslagen)' : 'nog niet ingevuld') : '(Enter)'"
               th:aria-label="'Antwoord, regel ' + ${r.index + 1}">
        <span style="display:flex;flex-direction:column;gap:4px;font-size:13px">
            <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" th:name="${prefix} + 'Secret-' + ${r.index}" th:checked="${r.secret}"> wachtwoord</label>
            <label th:if="${r.hasSecretValue}" style="display:flex;gap:6px;align-items:center"><input type="checkbox" th:name="${prefix} + 'Clear-' + ${r.index}"> wissen</label>
        </span>
    </div>
</section>
</body>
</html>
