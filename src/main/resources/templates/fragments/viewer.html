<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Een bestand (afbeelding, pdf of tekst) in een popup, met een downloadlink. Knoppen: data-viewer data-url data-title data-kind (image, pdf of text). -->
<th:block th:fragment="viewer">
    <style>
        #viewer { width: min(1000px, 94vw); height: min(92vh, 960px); padding: 0; border: 0; border-radius: 12px; overflow: hidden; }
        #viewer[open] { display: flex; flex-direction: column; }
        #viewer::backdrop { background: rgba(0, 0, 0, .55); }
        #viewer .viewer-head { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #ddd; background: #fff; }
        #viewer .viewer-head .viewer-title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #viewer .viewer-body { flex: 1; min-height: 0; overflow: auto; background: #f1f1f1; display: flex; justify-content: center; }
        #viewer .viewer-body img { max-width: 100%; height: auto; align-self: flex-start; }
        #viewer .viewer-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
    <dialog id="viewer" aria-label="Bestand bekijken">
        <div class="viewer-head">
            <span class="viewer-title" id="viewer-title"></span>
            <a class="btn btn-s btn-sm" id="viewer-download" href="#" download>Download</a>
            <button class="btn btn-p btn-sm" type="button" id="viewer-close">Sluiten</button>
        </div>
        <div class="viewer-body" id="viewer-body"></div>
    </dialog>
    <script th:src="@{/js/viewer.js}"></script>
</th:block>
</body>
</html>
