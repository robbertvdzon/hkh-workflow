spring.application.name=hkh-workflow

# Bereikbaar vanaf andere systemen. Let op: de app start .exe-bestanden; zet hem alleen op een server waar niet iedereen bij kan.
server.address=${HKH_WORKFLOW_ADDRESS:0.0.0.0}
server.port=${HKH_WORKFLOW_PORT:9000}

# Instellingen (mappen, exe's) worden bewaard in dit JSON-bestand, standaard naast de jar.
hkh.workflow.settings-file=${HKH_WORKFLOW_SETTINGS_FILE:hkh-workflow-settings.json}
# Codepagina van de DOS-box van images.exe en pdf2zcbs.exe (Nederlandse Windows: IBM850).
hkh.workflow.console-charset=${HKH_WORKFLOW_CONSOLE_CHARSET:IBM850}
# Wachtwoord van de beheerder (voor de instellingen en de technische pagina's). Zet het in application.properties naast de jar,
# of in de omgevingsvariabele HKH_WORKFLOW_ADMIN_PASSWORD. Leeg = niemand kan als beheerder inloggen, dus de instellingen blijven dicht.
hkh.workflow.admin-password=${HKH_WORKFLOW_ADMIN_PASSWORD:}
# Wat er al verwerkt is (een regel per bestand). Zonder pad komt het naast het instellingenbestand.
hkh.workflow.processed-log=${HKH_WORKFLOW_PROCESSED_LOG:hkh-workflow-verwerkt.tsv}
# Elke inlogpoging en elke doorloop (met alle instellingen, bestanden en logs) wordt gemeld aan het workflow-logboek van hkh-admin. Leeg = niets melden.
hkh.workflow.admin-log-url=${HKH_WORKFLOW_ADMIN_LOG_URL:https://hkh-admin.vdzonsoftware.nl}
# Per run een logbestand met tijdstempels van alle uitvoer en invoer.
hkh.workflow.log-dir=${HKH_WORKFLOW_LOG_DIR:logs}

spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info

# Geen ;jsessionid= in redirect-URLs (flashberichten gebruiken de sessie).
server.servlet.session.tracking-modes=cookie
