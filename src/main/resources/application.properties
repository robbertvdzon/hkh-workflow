spring.application.name=hkh-workflow

# Bereikbaar vanaf andere systemen. Let op: er is nog geen login en de app start .exe-bestanden.
server.address=${HKH_WORKFLOW_ADDRESS:0.0.0.0}
server.port=${HKH_WORKFLOW_PORT:9000}

# Instellingen (mappen, exe's) worden bewaard in dit JSON-bestand, standaard naast de jar.
hkh.workflow.settings-file=${HKH_WORKFLOW_SETTINGS_FILE:hkh-workflow-settings.json}
# Codepagina van de DOS-box van images.exe en pdf2zcbs.exe (Nederlandse Windows: IBM850).
hkh.workflow.console-charset=${HKH_WORKFLOW_CONSOLE_CHARSET:IBM850}

spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info
